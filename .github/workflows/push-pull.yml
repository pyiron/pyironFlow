# This runs jobs which pyiron modules should run on pushes or PRs to main

name: Push-main-Pull-all

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  pyiron:
    uses: pyiron/actions/.github/workflows/push-pull.yml@actions-4.2.1
    secrets: inherit
    with:
      python-version-alt1: '3.11'
      python-version-alt2: '3.12'
      python-version: '3.13'
      python-version-alt3: 'exclude'
      notebooks-env-files: .ci_support/environment.yml .ci_support/environment-binder.yml
      do-build-notebooks: false
      do-codecov: true
      do-codacy: true
      do-coveralls: false
      alternate-tests-env-files: .ci_support/lower-bounds.yml
      alternate-tests-python-version: '3.11'
      alternate-tests-dir: tests/unit
